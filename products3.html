<!DOCTYPE html>
<html>
<head>
<title>Products</title>
<style>
.product {
width: 400px;
margin: 10px;
padding: 10px;
border: 2px solid #000000;
}

.product h3 {
margin: 0;
}
</style>
</head>
<body>

<select id="categorySelect"></select>
<input type="button" id="filterBtn" value="Filter">
<div id="filterResult"></div>

<input type="button" id="loadBtn" value="Show Products">

<div id="result"></div>

<script>
var allProducts = [];

// runs when the page loads
function page() {
  document.getElementById("loadBtn").onclick = loadProducts;
  document.getElementById("filterBtn").onclick = filterProducts;
  loadCategories();
}

// reads products.json when the page loads and fills the drop-down with the categories
function loadCategories() {
  var request = new XMLHttpRequest();
  request.open("GET", "products.json", true);

  request.onreadystatechange = function() {
    if (request.readyState == 4 && request.status == 200) {
      allProducts = JSON.parse(request.responseText);

      // using a set to make sure each product category is jsut added once 
      var categories = new Set();
      allProducts.forEach(function(product) {
        product.categories.forEach(function(category) {
          categories.add(category);
        });
      });

      //build a option for each category
      var options = "";
      categories.forEach(function(category) {
        options += "<option value='" + category + "'>" + category + "</option>";
      });
      document.getElementById("categorySelect").innerHTML = options;
    }
  }
  request.send();
}

//shows the product names in the selected category
function filterProducts() {
  var selected = document.getElementById("categorySelect").value;

  var output = "";
  for (let i = 0; i < allProducts.length; i++) {
    if (allProducts[i].categories.indexOf(selected) != -1)
      output += "<p>" + allProducts[i].name + "</p>";
  }

  document.getElementById("filterResult").innerHTML = output;
}

//reads products.json and shows each product in a div
function loadProducts() {
  var request = new XMLHttpRequest();
  request.open("GET", "products.json", true);

  request.onreadystatechange = function() {
    if (request.readyState == 4 && request.status == 200) {
      var products = JSON.parse(request.responseText);

      // build the HTML for all the products
      var output = "";
      for (let i = 0; i < products.length; i++) {
        output += "<div class='product'>";
        output += "<h3>" + products[i].name + "</h3>";
        output += "<p>" + products[i].description + "</p>";
        output += "<p>Price: $" + products[i].price + "</p>";
        output += "<p>Categories: " + products[i].categories.join(", ") + "</p>";
        output += "</div>";
      }

      // put it on the page
      document.getElementById("result").innerHTML = output;
    }
  }
  request.send();
}

window.onload = page;
</script>

</body>
</html>
